id = "vacation-wake"
title = "good boy wakes up"
neutral_title = "Wake up (vacation cadence)"
duration_minutes = 1
sticker_id = "sunrise"
default_cadence = "daily"
default_times = ["09:00"]
tags = ["self-care", "vacation"]

