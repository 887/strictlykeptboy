# Phase AAA.4 / HV-D — atomic-vacation-daily template.
# vacation = lazy-slob risk zone. This template's job is to prevent
# slob-drift without imposing the full home routine. the good-boy stays
# a good-boy by doing the bare-essentials on schedule. routine calendars
# are superseded for the trip window; THIS template runs in their place.

schema_version = 1
template_id = "atomic-vacation-daily"
display_name = "Vacation daily"
category = "self-care"
neutral_safe = true

