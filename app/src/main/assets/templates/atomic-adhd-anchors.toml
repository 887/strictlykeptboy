# Phase AAA.5 / HV-K — atomic-adhd-anchors template.
# ADHD brains lose track of body signals; the inverted habit model lets
# us schedule the body-doubling without the schedule feeling like
# surveillance. Default state = done; deviation = explicit. Watch buzz
# is the gentle hand on the shoulder, not a drill sergeant.
# 34 anchors across 6 categories.

schema_version = 1
template_id = "atomic-adhd-anchors"
display_name = "ADHD body-doubling anchors"
category = "adhd-anchors"
neutral_safe = true

