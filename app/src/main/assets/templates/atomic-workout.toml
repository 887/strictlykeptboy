# Phase XX.6 / AT-F — atomic workout template (LOCKED content per
# draft-atomic-activities.md). Workouts are NEUTRAL (no `kink` tag);
# a kink-tagged variant template can layer on later. Sub-beats per
# AT-F.4: one sub-beat per set, so the phone buzzes between sets.

schema_version = 1
template_id = "atomic-workout"
display_name = "Atomic workout"
category = "fitness"
neutral_safe = true

[[entry]]
id = "pushups"
title = "Push-ups"
duration_minutes = 3
sticker_id = "pushup"
sets = 2
reps = 40
default_cadence = "daily"
default_times = ["07:00"]
[[entry.subbeat]]
label = "Set 1/2 — 40 reps"
duration_seconds = 90
[[entry.subbeat]]
label = "Set 2/2 — 40 reps"
duration_seconds = 90

